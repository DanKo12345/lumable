name: Feature request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: Tell me what you are trying to do.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like LumaBLE to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or extra context
      description: Add screenshots, examples, or links if helpful.
